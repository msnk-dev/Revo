[project]
name = "revo-backend"
version = "0.1.0"
description = "Revo subscription management backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.55",
  "alembic==1.20.1",
  "pydantic==2.14.0",
  "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "PyJWT[crypto]==2.15.1",
  "APScheduler==3.11.3",
  "python-dateutil==2.9.0.post0",
  "reportlab==5.0.1",
  "Jinja2==3.1.6",
  "openai==2.8.1",
  "email-validator==2.3.0",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.1",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

