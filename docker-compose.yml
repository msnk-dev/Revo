services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revo
      POSTGRES_USER: revo
      POSTGRES_PASSWORD: revo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revo -d revo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://revo:revo@postgres:5432/revo
      SMTP_HOST: mailhog
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:

