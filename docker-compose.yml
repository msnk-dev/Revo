services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revo
      POSTGRES_USER: revo
      POSTGRES_PASSWORD: revo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revo -d revo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Revo}
      APP_ENV: ${APP_ENV:-development}
      APP_CURRENCY: ${APP_CURRENCY:-INR}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-secret-change-this-key}
      DATABASE_URL: postgresql+psycopg://revo:revo@postgres:5432/revo
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@revo.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_SCHEDULER: "true"
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-groq,hf}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_ROUTER_MODEL: ${GROQ_ROUTER_MODEL:-openai/gpt-oss-20b}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-openai/gpt-oss-120b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-100000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

